<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Editor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
        }

        #editor {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            border: none;
            outline: none;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            background-color: #ffffff;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        #editor:focus {
            outline: none;
        }

        .variable {
            color: #0078D4;
            font-weight: 500;
            background-color: #E7F3FF;
            padding: 2px 4px;
            border-radius: 2px;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            display: inline-block;
        }

        /* Selection styling */
        #editor::selection {
            background-color: rgba(0, 120, 212, 0.2);
        }

        /* Print styles */
        @media print {
            #editor {
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="setup-editor.js"></script>
</body>
</html>
